name: Build curl+OpenSSL Windows packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      curl_version:
        description: "curl version (e.g. 8.11.1)"
        required: true
        default: "8.11.1"
      openssl_version:
        description: "OpenSSL version (e.g. 3.3.2)"
        required: true
        default: "3.3.2"

permissions:
  contents: write

concurrency:
  group: curl-openssl-${{ github.ref }}
  cancel-in-progress: true

env:
  CURL_VERSION: ${{ github.event.inputs.curl_version || '8.11.1' }}
  OPENSSL_VERSION: ${{ github.event.inputs.openssl_version || '3.3.2' }}

jobs:
  msvc:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        link: [static, shared]
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Setup Strawberry Perl
        run: choco install strawberryperl -y --no-progress

      - name: Build
        shell: pwsh
        env:
          CURL_VERSION: ${{ env.CURL_VERSION }}
          OPENSSL_VERSION: ${{ env.OPENSSL_VERSION }}
        run: |
          $env:Path = "C:\Strawberry\perl\bin;$env:Path"
          ./scripts/build-msvc.ps1 -Arch ${{ matrix.arch }} -LinkType ${{ matrix.link }} `
            -OutDir "$PWD/dist/windows-msvc-${{ matrix.arch }}-${{ matrix.link }}"

      - name: Zip
        shell: pwsh
        run: |
          $name = "curl-openssl-${{ env.CURL_VERSION }}-openssl-${{ env.OPENSSL_VERSION }}-windows-msvc-${{ matrix.arch }}-${{ matrix.link }}"
          Compress-Archive -Path "dist/windows-msvc-${{ matrix.arch }}-${{ matrix.link }}\*" -DestinationPath "dist/$name.zip" -Force
          # Also ship a tools-only zip with curl.exe (+ DLL deps for shared)
          $tools = "dist/tools-msvc-${{ matrix.arch }}-${{ matrix.link }}"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Copy-Item "dist/windows-msvc-${{ matrix.arch }}-${{ matrix.link }}\bin\*" $tools -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$tools\*" -DestinationPath "dist/curl-${{ env.CURL_VERSION }}-openssl-${{ env.OPENSSL_VERSION }}-windows-msvc-${{ matrix.arch }}-${{ matrix.link }}-tools.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: msvc-${{ matrix.arch }}-${{ matrix.link }}
          path: dist/*.zip
          if-no-files-found: error

  mingw:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        link: [static, shared]
        arch: [x64, x86]
        include:
          - arch: x64
            msystem: MINGW64
            packages: mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
          - arch: x86
            msystem: MINGW32
            packages: mingw-w64-i686-toolchain mingw-w64-i686-cmake mingw-w64-i686-ninja
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.packages }}
            make
            tar
            curl
            git
            perl
            python

      - name: Build
        env:
          CURL_VERSION: ${{ env.CURL_VERSION }}
          OPENSSL_VERSION: ${{ env.OPENSSL_VERSION }}
        run: |
          chmod +x scripts/build-mingw.sh
          ./scripts/build-mingw.sh ${{ matrix.link }} ${{ matrix.arch }} "$PWD/dist/windows-mingw-${{ matrix.arch }}-${{ matrix.link }}"

      - name: Zip
        shell: pwsh
        run: |
          $name = "curl-openssl-${{ env.CURL_VERSION }}-openssl-${{ env.OPENSSL_VERSION }}-windows-mingw-${{ matrix.arch }}-${{ matrix.link }}"
          Compress-Archive -Path "dist/windows-mingw-${{ matrix.arch }}-${{ matrix.link }}\*" -DestinationPath "dist/$name.zip" -Force
          $tools = "dist/tools-mingw-${{ matrix.arch }}-${{ matrix.link }}"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Copy-Item "dist/windows-mingw-${{ matrix.arch }}-${{ matrix.link }}\bin\*" $tools -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$tools\*" -DestinationPath "dist/curl-${{ env.CURL_VERSION }}-openssl-${{ env.OPENSSL_VERSION }}-windows-mingw-${{ matrix.arch }}-${{ matrix.link }}-tools.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: mingw-${{ matrix.arch }}-${{ matrix.link }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [msvc, mingw]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten zips
        run: |
          mkdir -p dist
          find artifacts -name '*.zip' -exec cp -v {} dist/ \;
          ls -la dist
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-openssl-{1}', env.CURL_VERSION, env.OPENSSL_VERSION) }}
          name: curl ${{ env.CURL_VERSION }} + OpenSSL ${{ env.OPENSSL_VERSION }}
          body: |
            Prebuilt **libcurl + OpenSSL + curl.exe** for Windows.

            ### SDK zips (`curl-openssl-*-windows-...`)
            `include/` + `lib/` + `bin/curl.exe` (+ DLLs for shared) + CMake package.

            | Pattern | Notes |
            |---------||-------|
            | `*-msvc-x64-static.zip` | MSVC x64 static (rim-agent) |
            | `*-msvc-x86-static.zip` | MSVC Win32 static |
            | `*-msvc-*-shared.zip` | MSVC DLL |
            | `*-mingw-x64-*` / `*-mingw-x86-*` | MinGW-w64 |
            | `curl-*-tools.zip` | CLI only: curl.exe (+ DLLs if shared) |
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
